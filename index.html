<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>UZB Car Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="game"></canvas>
<div class="vignette" id="vignette"></div>

<!-- HUD -->
<div id="hud" hidden>
  <button class="hud-btn" id="btn-pause" aria-label="Пауза"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  <div class="hud-money" id="money">0</div>
  <div class="hud-level" id="level-panel" hidden>
    <div class="lv-top"><b id="lvl-name"></b><span id="lvl-time">0:00</span><span class="lv-hits"><i>касаний</i> <span id="lvl-hits">0</span></span></div>
    <div id="lvl-hint" class="lv-hint"></div>
  </div>
  <div class="hud-signal" id="signal" hidden><i class="r"></i><i class="y"></i><i class="g"></i><span id="signal-t"></span></div>
  <canvas id="minimap" width="280" height="280" title="Открыть карту (M)"></canvas>
  <button class="hud-btn map-btn" id="btn-map" aria-label="Карта"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2"/></svg></button>
  <div class="hud-speed"><b id="speed">0</b><span>км/ч</span><i id="gear">N</i><div class="speed-bar"><em id="speed-bar"></em></div></div>
  <div class="hud-gauges"><div class="gauge" title="Бензин"><svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h4"/></svg><div class="gbar"><em id="fuel-bar"></em></div></div>
    <div class="gauge" title="Состояние"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><div class="gbar"><em id="hp-bar"></em></div></div></div>
  <button class="svc-btn" id="svc-btn" hidden></button>
  <div id="toast" class="toast"></div>
</div>

<!-- Сенсорное управление -->
<div id="touch" hidden>
  <div class="t-left">
    <button data-k="left" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <button data-k="right" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>
  <div class="t-right">
    <div class="t-small">
      <button data-k="cam" class="sm" aria-label="Камера"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><path d="M4 8h3l2-2h6l2 2h3v11H4z"/></svg></button>
      <button data-k="brake" class="sm" aria-label="Ручник">P</button>
    </div>
    <button data-k="down" class="pedal" aria-label="Тормоз"><span>Т</span></button>
    <button data-k="up" class="pedal gas" aria-label="Газ"><span>Г</span></button>
  </div>
</div>

<!-- Большая карта -->
<section id="bigmap" class="bigmap" hidden>
  <canvas id="bigmap-c"></canvas>
  <header class="bm-head"><h2>Карта</h2>
    <div class="bm-tabs"><button data-go="city" class="on">Весь город</button><button data-go="me">Где я</button></div>
    <button class="close" id="bm-close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div class="bm-zoom"><button id="bm-in" aria-label="Приблизить">+</button><button id="bm-out" aria-label="Отдалить">−</button></div>
  <div class="bm-legend"><span><i class="l-mount"></i>Районы</span><span><i class="l-sight"></i>Мосты и башня</span><span><i class="l-park"></i>Парки</span><span><i class="l-city"></i>Места</span></div>
</section>

<!-- Заставка -->
<section id="menu" class="screen title">
  <div class="title-box">
    <div class="brand huge"><i class="mark"></i><span>UZB <b>Car Parking</b></span></div>
    <p class="tagline">Открытый город · парковка · тюнинг</p>
    <button class="start" id="btn-start"><span>Старт</span></button>
    <div class="title-progress" id="title-progress"><i id="title-bar"></i></div>
  </div>
  <footer class="menu-foot">
    <button class="link" id="btn-credits">Авторы моделей</button>
    <p class="credits" id="credits" hidden></p>
  </footer>
</section>

<!-- Уровни -->
<section id="levels" class="screen sheet-screen" hidden>
  <div class="sheet">
    <header class="sheet-head"><h2>Парковка</h2><button class="close" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div id="level-grid" class="level-grid"></div>
  </div>
</section>

<!-- Гараж: 3D-студия, машину можно крутить -->
<section id="garage" class="screen garage-screen" hidden>
  <header class="topbar">
    <button class="round" id="btn-home" aria-label="На заставку"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <div class="wallet" id="garage-money"></div>
  </header>
  <aside class="gpanel">
    <div class="gtabs"><button data-tab="cars" class="on">Машины</button><button data-tab="paint">Покраска</button><button data-tab="tune">Тюнинг</button></div>
    <div class="gtab" id="tab-cars">
      <div class="car-list" id="car-tabs"></div>
      <p class="car-desc" id="car-desc"></p>
      <div class="specs" id="car-specs"></div>
    </div>
    <div class="gtab" id="tab-paint" hidden>
      <div class="label">Кузов</div><div class="swatches" id="color-list"></div>
      <div class="label">Диски</div><div class="swatches" id="rim-list"></div>
    </div>
    <div class="gtab" id="tab-tune" hidden><div class="tune-list" id="tune-list"></div></div>
  </aside>
  <div class="gname"><small id="gname-hint">Крути машину мышкой или пальцем</small><b id="menu-car-name"></b></div>
  <nav class="dock">
    <button class="dock-btn" id="btn-levels"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 16V8h3.5a2.5 2.5 0 0 1 0 5H9"/></svg><span>Парковка</span></button>
    <button class="dock-btn play" id="btn-play"><span>Ехать</span><small id="play-sub">Открытый город</small></button>
  </nav>
</section>

<!-- Итог уровня -->
<section id="result" class="screen sheet-screen" hidden>
  <div class="sheet small center">
    <h2 id="res-title"></h2>
    <div id="res-stars" class="stars"></div>
    <p id="res-text" class="muted"></p>
    <div class="row2">
      <button class="btn" id="res-retry">Заново</button>
      <button class="btn primary" id="res-next">Дальше</button>
    </div>
    <button class="link" id="res-menu">В меню</button>
  </div>
</section>

<div class="city-wait" id="city-wait" hidden><b>Город строится…</b><div class="bar"><i id="load-bar"></i></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
