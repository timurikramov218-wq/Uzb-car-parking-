<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<title>UZB Car Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" hidden>
  <button class="glass round" id="btn-pause" aria-label="Пауза">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
  </button>
  <div class="glass pill money" id="money">0 сум</div>
  <div class="glass level" id="level-panel" hidden>
    <div class="level-row"><b id="lvl-name"></b><span id="lvl-time">0:00</span><span id="lvl-hits">0</span></div>
    <div id="lvl-hint" class="level-hint"></div>
  </div>
  <canvas id="minimap" width="264" height="264"></canvas>
  <div class="glass speed"><b id="speed">0</b><span>км/ч</span><i id="gear">N</i></div>
  <div id="toast" class="toast"></div>
</div>

<!-- Сенсорное управление -->
<div id="touch" hidden>
  <div class="t-left">
    <button data-k="left" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <button data-k="right" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>
  <div class="t-right">
    <div class="t-small">
      <button data-k="cam" class="sm" aria-label="Камера"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M4 8h3l2-2h6l2 2h3v10H4z"/></svg></button>
      <button data-k="brake" class="sm" aria-label="Ручник">P</button>
    </div>
    <button data-k="down" class="pedal" aria-label="Тормоз"></button>
    <button data-k="up" class="pedal gas" aria-label="Газ"></button>
  </div>
</div>

<!-- Главное меню -->
<section id="menu" class="screen menu" hidden>
  <div class="menu-card glass">
    <div class="eyebrow">Toshkent</div>
    <h1>Car Parking</h1>
    <p class="lead">Открытый город и десять уровней парковки</p>
    <div class="actions">
      <button class="btn primary" id="btn-play">Поехать <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="row2">
        <button class="btn" id="btn-levels">Парковка</button>
        <button class="btn" id="btn-garage">Гараж</button>
      </div>
    </div>
    <div class="foot"><span id="menu-money"></span><button class="link" id="btn-credits">Авторы моделей</button></div>
    <p class="credits" id="credits" hidden></p>
  </div>
</section>

<!-- Уровни -->
<section id="levels" class="screen" hidden>
  <div class="sheet glass">
    <header><h2>Парковка</h2><button class="glass round close" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div id="level-grid" class="level-grid"></div>
  </div>
</section>

<!-- Гараж -->
<section id="garage" class="screen side" hidden>
  <div class="sheet glass garage">
    <header><h2>Гараж</h2><button class="glass round close" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="seg" id="car-tabs"></div>
    <p class="car-desc" id="car-desc"></p>
    <div class="specs" id="car-specs"></div>
    <div class="label">Цвет</div>
    <div class="swatches" id="color-list"></div>
    <button class="btn primary wide" id="btn-buy"></button>
    <div class="garage-money" id="garage-money"></div>
  </div>
</section>

<!-- Итог уровня -->
<section id="result" class="screen" hidden>
  <div class="sheet glass small center">
    <h2 id="res-title"></h2>
    <div id="res-stars" class="stars"></div>
    <p id="res-text" class="muted"></p>
    <div class="row2">
      <button class="btn" id="res-retry">Заново</button>
      <button class="btn primary" id="res-next">Дальше</button>
    </div>
    <button class="link" id="res-menu">В меню</button>
  </div>
</section>

<section id="loading" class="screen loading">
  <div class="eyebrow">Toshkent</div>
  <div class="bar"><i id="load-bar"></i></div>
  <div class="muted" id="load-text">Загрузка машин…</div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
